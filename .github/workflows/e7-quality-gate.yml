name: E7 quality gate

on:
  push:
    branches: [e7-validation, main, e7-gate-demo]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-gate:
    name: e7-b-quality-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out the triggering revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Scan source and Git history
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/ci
          python3 -B scripts/secret_scan.py . --history 2>&1 | tee work/ci/source-secret-scan.log

      - name: Test collector failure propagation
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s e7/tests -v 2>&1 | tee work/ci/collector-unit-tests.log

      - name: Build, test and collect the six real gate cases
        shell: bash
        run: |
          set -euo pipefail
          python3 -B e7/scripts/collect_e7.py \
            --out work/ci/collection \
            --candidate e7/candidates/debian/Dockerfile \
            --provenance e7/candidates/debian/provenance.json \
            --service-build-timeout 1200 \
            --build-timeout 300 2>&1 | tee work/ci/collector-console.log

      - name: Scan the built service image
        if: ${{ always() && hashFiles('work/ci/collection/service-image-id.txt') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          image="$(cat work/ci/collection/service-image-id.txt)"
          [[ "$image" =~ ^sha256:[0-9a-f]{64}$ ]]
          python3 -B scripts/secret_scan.py . --image "$image" 2>&1 | tee work/ci/image-secret-scan.log

      - name: Preserve original logs and evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e7-b-quality-gate-${{ github.run_id }}-${{ github.run_attempt }}
          path: work/ci/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
