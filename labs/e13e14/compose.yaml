# Four separate runtime processes. Set E14_ROOT and E14_IMAGE before use.
x-common: &common
  image: ${E14_IMAGE:?set E14_IMAGE}
  pull_policy: never
  restart: unless-stopped
  user: "${E14_UID:-0}:${E14_GID:-0}"
  working_dir: /course
  environment: &runtime-environment
    HOME: /tmp
    PYTHONPATH: /course/labs/e8e10:/course/labs/e11e12/vendor:/app
    PYTHONDONTWRITEBYTECODE: "1"
  volumes:
    - ${E14_ROOT:?set E14_ROOT}:/course
  cpus: 1.0
  mem_limit: 768m
  pids_limit: 128
  security_opt:
    - no-new-privileges:true
  healthcheck:
    test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)"]
    interval: 5s
    timeout: 3s
    retries: 6

services:
  buildchecker:
    <<: *common
    environment:
      <<: *runtime-environment
      E14_ROLE: buildchecker
    command: ["python3", "labs/e13e14/service.py"]
    ports: ["127.0.0.1:${E14_BUILDCHECKER_PORT:-18081}:8080"]
    cap_add: ["SYS_PTRACE"]

  echecker:
    <<: *common
    environment:
      <<: *runtime-environment
      E14_ROLE: echecker
    command: ["python3", "labs/e13e14/service.py"]
    ports: ["127.0.0.1:${E14_ECHECKER_PORT:-18082}:8080"]

  draft:
    <<: *common
    environment:
      <<: *runtime-environment
      E14_ROLE: draft
    group_add: ["${E14_DOCKER_GID:-0}"]
    command: ["python3", "labs/e13e14/service.py"]
    ports: ["127.0.0.1:${E14_DRAFT_PORT:-18083}:8080"]
    volumes:
      - ${E14_ROOT:?set E14_ROOT}:/course
      - /var/run/docker.sock:/var/run/docker.sock

  mdfixer:
    <<: *common
    environment:
      <<: *runtime-environment
      E14_ROLE: mdfixer
    command: ["python3", "labs/e13e14/service.py"]
    ports: ["127.0.0.1:${E14_MDFIXER_PORT:-18084}:8080"]
